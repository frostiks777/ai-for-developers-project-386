services:
  - type: web
    name: calendar-slots-app
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Строка подключения Neon (Postgres) приходит из Environment Group «DB»
      - fromGroup: DB
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Демо-пароль панели организатора (см. README → «Доступ организатора»)
      - key: ADMIN_PASSWORD
        value: call-calendar-admin
      # Cloudflare Turnstile (ADR-0025). CAPTCHA выключена, пока не задан
      # TURNSTILE_SECRET_KEY. Настоящие ключи НЕ коммитим — задать в
      # Environment Group (Render → Environment → Add). Здесь только напоминание:
      #   TURNSTILE_SITEKEY=0x4AAAA...
      #   TURNSTILE_SECRET_KEY=0x4AAAA...
      #   TURNSTILE_ALLOWED_HOSTNAMES=calendar-slots-app.onrender.com
